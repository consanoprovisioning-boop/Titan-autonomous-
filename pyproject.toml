[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-crm-agent"
version = "0.1.0"
description = "Autonomous CRM Chief of Staff for Glenn Bordine's Eleads workflow (Valdosta Nissan / Valdosta Mitsubishi)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
browser = ["playwright>=1.45", "keyring>=25"]
dev = ["pytest>=8"]

[project.scripts]
titan = "titan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
